<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Booyah Rewards - Hybrid Free & Paid Free Fire Esports Tournaments, Live Rooms & Automated Payouts">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Booyah Rewards">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Booyah Rewards - Free Fire Esports Tournaments</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
  </style>
  <!-- Razorpay Official Web Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    // 1. Direct JS Order Creator
    window.createOrderViaJs = async function(payloadJson, callback) {
      try {
        var payload = JSON.parse(payloadJson);
        var res = await fetch('https://www.swgayanbhumi.in/api/payments/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        var data = await res.json();
        if (callback) callback(JSON.stringify(data));
      } catch (e) {
        console.error('JS Order Creation Error:', e);
        if (callback) callback(JSON.stringify({ success: false, error: e.toString() }));
      }
    };

    // 2. Window opener
    window.openWindowUrl = function(url) {
      window.open(url, '_blank');
    };

    // 3. Exact SW Tech Solution / Booyah Rewards Checkout Bridge
    window.openRazorpayModal = function(optionsJson, callback) {
      try {
        var options = JSON.parse(optionsJson);
        options.name = options.name || 'Booyah Rewards';
        options.image = options.image || 'https://www.swgayanbhumi.in/logo.png';
        options.theme = options.theme || { color: '#E50914' };
        
        // Clean order_id: remove if empty or dummy
        if (!options.order_id || typeof options.order_id !== 'string' || options.order_id.trim() === '' || options.order_id.startsWith('order_sw_')) {
          delete options.order_id;
        }
        
        options.handler = function(response) {
          if (callback) {
            callback(JSON.stringify({
              status: 'success',
              razorpay_payment_id: response.razorpay_payment_id || ('pay_' + Date.now()),
              razorpay_order_id: response.razorpay_order_id || '',
              razorpay_signature: response.razorpay_signature || ''
            }));
          }
        };
        options.modal = {
          ondismiss: function() {
            if (callback) {
              callback(JSON.stringify({
                status: 'dismissed',
                message: 'Payment cancelled by user'
              }));
            }
          }
        };
        var rzp = new window.Razorpay(options);
        rzp.on('payment.failed', function(response) {
          if (callback) {
            callback(JSON.stringify({
              status: 'failed',
              error: (response.error && response.error.description) ? response.error.description : 'Payment Failed'
            }));
          }
        });
        rzp.open();
      } catch (err) {
        console.error('Razorpay open error:', err);
        if (callback) {
          callback(JSON.stringify({
            status: 'error',
            message: err.toString()
          }));
        }
      }
    };

    // 4. Web Push Notification Bridge
    window.requestNotificationPermission = async function() {
      if (!("Notification" in window)) {
        console.warn("[WebNotifications] Notifications are not supported in this browser.");
        return "unsupported";
      }
      if (Notification.permission === "granted") {
        return "granted";
      }
      try {
        var perm = await Notification.requestPermission();
        console.log("[WebNotifications] Permission result:", perm);
        return perm;
      } catch (e) {
        console.error("[WebNotifications] Permission request error:", e);
        return "denied";
      }
    };

    window.showWebNotification = function(title, body, iconUrl, clickUrl) {
      if (!("Notification" in window) || Notification.permission !== "granted") {
        return false;
      }
      try {
        var options = {
          body: body || "Tournament alert",
          icon: iconUrl || "https://www.swgayanbhumi.in/logo.png",
          badge: "https://www.swgayanbhumi.in/logo.png",
          vibrate: [200, 100, 200]
        };
        var notif = new Notification(title || "Booyah Rewards", options);
        notif.onclick = function() {
          window.focus();
          if (clickUrl) {
            window.location.href = clickUrl;
          }
          notif.close();
        };
        return true;
      } catch (e) {
        console.error("[WebNotifications] Error showing desktop notification:", e);
        return false;
      }
    };

    // Auto-prompt permission on first user tap / click anywhere if not yet requested
    function autoPromptNotificationPermission() {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().then(function(p) {
          console.log("[WebNotifications] Auto permission prompt status:", p);
        }).catch(function(e) {});
      }
      document.removeEventListener('click', autoPromptNotificationPermission);
      document.removeEventListener('touchstart', autoPromptNotificationPermission);
    }
    document.addEventListener('click', autoPromptNotificationPermission);
    document.addEventListener('touchstart', autoPromptNotificationPermission);

    // Register Service Worker for FCM Background Push if supported
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/firebase-messaging-sw.js').then(function(reg) {
          console.log('[ServiceWorker] FCM messaging service worker registered:', reg.scope);
        }).catch(function(err) {
          console.warn('[ServiceWorker] FCM service worker registration notice:', err);
        });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
