<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Booyah Rewards - Hybrid Free & Paid Free Fire Esports Tournaments, Live Rooms & Automated Payouts">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Booyah Rewards">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Booyah Rewards - Free Fire Esports Tournaments</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
  </style>
  <script>
    // 1. Window opener
    window.openWindowUrl = function(url) {
      window.open(url, '_blank');
    };

    // 2. Web Push Notification Bridge
    window.getNotificationPermissionStatus = function() {
      if (!("Notification" in window)) {
        return "unsupported";
      }
      return Notification.permission; // "default", "granted", or "denied"
    };

    window.requestNotificationPermission = async function() {
      if (!("Notification" in window)) {
        console.warn("[WebNotifications] Notifications are not supported in this browser.");
        return "unsupported";
      }
      if (Notification.permission === "granted") {
        return "granted";
      }
      try {
        var perm = await Notification.requestPermission();
        console.log("[WebNotifications] Permission result:", perm);
        return perm;
      } catch (e) {
        console.error("[WebNotifications] Permission request error:", e);
        return "denied";
      }
    };

    window.showWebNotification = function(title, body, iconUrl, clickUrl) {
      if (!("Notification" in window) || Notification.permission !== "granted") {
        console.warn("[WebNotifications] Cannot show notification, permission status:", Notification.permission);
        return false;
      }
      try {
        var options = {
          body: body || "Tournament alert",
          icon: iconUrl || "https://booyehreward.vercel.app/booyah_logo.png",
          badge: "https://booyehreward.vercel.app/booyah_logo.png",
          vibrate: [200, 100, 200],
          requireInteraction: false,
          tag: 'booyah_notif_' + Date.now()
        };

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(function(reg) {
            reg.showNotification(title || "Booyah Rewards", options);
          }).catch(function(err) {
            var notif = new Notification(title || "Booyah Rewards", options);
            if (clickUrl) {
              notif.onclick = function() { window.focus(); window.location.href = clickUrl; notif.close(); };
            }
          });
        } else {
          var notif = new Notification(title || "Booyah Rewards", options);
          if (clickUrl) {
            notif.onclick = function() { window.focus(); window.location.href = clickUrl; notif.close(); };
          }
        }
        return true;
      } catch (e) {
        console.error("[WebNotifications] Error showing desktop notification:", e);
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(function(reg) {
              reg.showNotification(title || "Booyah Rewards", { body: body || "Tournament alert" });
            });
          }
        } catch (e2) {}
        return false;
      }
    };

    // Auto-prompt permission on first user tap / click anywhere if not yet requested
    function autoPromptNotificationPermission() {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().then(function(p) {
          console.log("[WebNotifications] Auto permission prompt status:", p);
        }).catch(function(e) {});
      }
      document.removeEventListener('click', autoPromptNotificationPermission);
      document.removeEventListener('touchstart', autoPromptNotificationPermission);
    }
    document.addEventListener('click', autoPromptNotificationPermission);
    document.addEventListener('touchstart', autoPromptNotificationPermission);

    // Register Service Worker for FCM Background Push if supported
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/firebase-messaging-sw.js').then(function(reg) {
          console.log('[ServiceWorker] FCM messaging service worker registered:', reg.scope);
        }).catch(function(err) {
          console.warn('[ServiceWorker] FCM service worker registration notice:', err);
        });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
